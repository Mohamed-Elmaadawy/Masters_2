# Example RunConfig (orchestrator/config.py). Loadable and resolvable today:
#
#   from pathlib import Path
#   from orchestrator.config import load_run_config, resolve_run_config
#   config = load_run_config(Path("orchestrator/example_run_config.yaml"))
#   resolved = resolve_run_config(config, Path("orchestrator/example_run_config.yaml"))
#
# Prompt files under example_prompts/ are the real v1 prompts orchestrator/stages.py
# calls in production (written by the same commit that wired stages.py, 6ebd388) --
# not placeholders. prompt_hash below is computed from this exact content, the same
# way it is for a real run.
#
# API keys are never in this file, by design -- GeminiAdapter.from_env()/
# GroqAdapter.from_env() read GEMINI_API_KEY/GROQ_API_KEY from the environment only.
# Set GEMINI_API_KEYS/GROQ_API_KEYS instead (comma-separated) to rotate across several
# keys on quota exhaustion -- see orchestrator/providers/rotating.py.

run_id: null          # omitted -> minted (uuid4 hex) at resolve time
output_dir: runs      # resolved relative to THIS file's directory, not the cwd
max_revisions: 3

retry:
  max_attempts: 3
  initial_delay_seconds: 2.0
  multiplier: 2.0

# One entry per distinct provider/model actually in use below -- resolve_run_config
# rejects a config where any resolved model is missing an entry here. Gemini's own
# free-tier dashboard is the source of truth for a real requests_per_minute number;
# 15 rpm is illustrative. tokens_per_minute is null for Gemini -- the 2026-08-10 first
# real run measured an absolute per-model request cap (20 requests) for
# gemini-3.6-flash, not a token-rate limit, so there is no real TPM number to put here
# (see docs/superpowers/results/2026-08-10-first-real-run/ANALYSIS.md); inventing one
# would be worse than leaving it unthrottled by tokens.
rate_limits:
  gemini/gemini-3.6-flash: {requests_per_minute: 15, tokens_per_minute: null}
  # 12000 is real, measured, and cited: Groq's own 429 body during that same run quoted
  # "Rate limit reached for model llama-3.3-70b-versatile ... tokens per minute (TPM):
  # Limit 12000" -- see ANALYSIS.md, "Surprises" #1. requests_per_minute (30) was never
  # the binding constraint that run hit; tokens_per_minute is.
  groq/llama-3.3-70b-versatile: {requests_per_minute: 30, tokens_per_minute: 12000}

defaults:
  provider: gemini
  model: gemini-3.6-flash
  prompt_version: v1
  temperature: 1.0
  timeout_seconds: 30
  output_mode: text

# Per-stage overrides -- omitted fields fall back to `defaults` above. Only the
# Classifier is shown diverging (a cheaper/different provider for a simpler stage,
# per DESIGN_NOTES.md's "mixed setups" example); every other stage uses `defaults`
# untouched.
stages:
  classifier:
    provider: groq
    model: llama-3.3-70b-versatile
  quality_checker: {}
  refiner_questioner: {}
  refiner_rewriter: {}
  strategy_selector: {}
  test_generator: {}
  consistency_checker: {}
  dependency_mapper: {}

# Required, exactly one entry per stage -- a file path, never a hand-typed hash. Paths
# are resolved relative to this YAML file's own directory.
prompts:
  consistency_checker: example_prompts/consistency_checker.txt
  dependency_mapper: example_prompts/dependency_mapper.txt
  classifier: example_prompts/classifier.txt
  quality_checker: example_prompts/quality_checker.txt
  refiner_questioner: example_prompts/refiner_questioner.txt
  refiner_rewriter: example_prompts/refiner_rewriter.txt
  strategy_selector: example_prompts/strategy_selector.txt
  test_generator: example_prompts/test_generator.txt
