# First real run (2026-08-10): every stage on groq/llama-3.3-70b-versatile. Companion
# to runs_gemini.yaml -- same document, same prompts, same retry/max_revisions,
# different provider -- see
# docs/superpowers/plans/2026-08-08-first-real-run-checklist.md.
#
# API keys are never in this file, by design -- GroqAdapter.from_env() reads
# GROQ_API_KEY from the environment only. Set GROQ_API_KEYS instead (comma-separated)
# to rotate across several keys on quota exhaustion -- see orchestrator/providers/rotating.py.

run_id: themas
output_dir: runs_groq   # resolved relative to THIS file's directory, not the cwd
max_revisions: 3

retry:
  max_attempts: 3
  initial_delay_seconds: 2.0
  multiplier: 2.0

# 12000 is real, measured, and cited: this run's own Groq 429 body quoted "Rate limit
# reached for model llama-3.3-70b-versatile ... tokens per minute (TPM): Limit 12000"
# -- see ../docs/superpowers/results/2026-08-10-first-real-run/ANALYSIS.md, "Surprises"
# #1. requests_per_minute (30) was never the binding constraint this run actually hit.
rate_limits:
  groq/llama-3.3-70b-versatile: {requests_per_minute: 30, tokens_per_minute: 12000}

defaults:
  provider: groq
  model: llama-3.3-70b-versatile
  prompt_version: v1
  temperature: 1.0
  timeout_seconds: 30
  output_mode: text

# No per-stage overrides -- every stage uses `defaults` (groq/llama-3.3-70b-versatile).
# consistency_checker_refined/dependency_mapper_refined (S3, "phase the pipeline" --
# design/DESIGN_NOTES.md) added 2026-08-16: the second, post-refinement document
# analysis, same defaults as their non-refined siblings.
stages:
  classifier: {}
  quality_checker: {}
  refiner_questioner: {}
  refiner_rewriter: {}
  strategy_selector: {}
  test_generator: {}
  consistency_checker: {}
  dependency_mapper: {}
  consistency_checker_refined: {}
  dependency_mapper_refined: {}

prompts:
  consistency_checker: example_prompts/consistency_checker.txt
  dependency_mapper: example_prompts/dependency_mapper.txt
  classifier: example_prompts/classifier.txt
  quality_checker: example_prompts/quality_checker.txt
  refiner_questioner: example_prompts/refiner_questioner.txt
  refiner_rewriter: example_prompts/refiner_rewriter.txt
  strategy_selector: example_prompts/strategy_selector.txt
  test_generator: example_prompts/test_generator.txt
  consistency_checker_refined: example_prompts/consistency_checker_refined.txt
  dependency_mapper_refined: example_prompts/dependency_mapper_refined.txt
