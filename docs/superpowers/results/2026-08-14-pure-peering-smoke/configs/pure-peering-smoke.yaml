# Smoke test, not an evaluation run -- confirms a freshly extracted PURE document
# (datasets/pure-extracted/pure-peering.json, 24 requirements) flows through the
# pipeline at all, before any Q1/Q2 evaluation work touches it. Copy of
# docs/superpowers/results/2026-08-11-behavior-scenarios/configs/scn-04-conflict-numeric-v2.yaml
# with only run_id, output_dir and this comment changed -- same retry/rate_limits/
# defaults/stages/prompts shape as every real run in that directory. prompt_version:
# v2 because that is what orchestrator/example_prompts/*.txt currently holds on disk
# (the v2 wording landed in place, per IMPLEMENTATION_LOG.md's prompt-v2-batch entry);
# this label was not chosen to make a comparison, there is nothing here to compare yet.
#
# API keys are never in this file, by design -- GeminiAdapter.from_env() reads
# GEMINI_API_KEY from the environment only. This run uses the PAID key via
# docs/superpowers/results/2026-08-10-gemini-paid-tier-run/paid_gemini_driver.py,
# unchanged, which reads GEMINI_API_KEY_PAID directly instead.

run_id: pure-peering-smoke
output_dir: runs_pure-peering-smoke   # resolved relative to THIS file's directory, not the cwd
max_revisions: 3

retry:
  max_attempts: 3
  initial_delay_seconds: 2.0
  multiplier: 2.0

rate_limits:
  gemini/gemini-3.6-flash: {requests_per_minute: 15, tokens_per_minute: null}

defaults:
  provider: gemini
  model: gemini-3.6-flash
  prompt_version: v2
  temperature: 1.0
  timeout_seconds: 30
  output_mode: text

stages:
  classifier: {}
  quality_checker: {}
  refiner_questioner: {}
  refiner_rewriter: {}
  strategy_selector: {}
  test_generator: {}
  consistency_checker: {}
  dependency_mapper: {}

prompts:
  classifier: ../../../../../orchestrator/example_prompts/classifier.txt
  quality_checker: ../../../../../orchestrator/example_prompts/quality_checker.txt
  refiner_questioner: ../../../../../orchestrator/example_prompts/refiner_questioner.txt
  refiner_rewriter: ../../../../../orchestrator/example_prompts/refiner_rewriter.txt
  strategy_selector: ../../../../../orchestrator/example_prompts/strategy_selector.txt
  test_generator: ../../../../../orchestrator/example_prompts/test_generator.txt
  consistency_checker: ../../../../../orchestrator/example_prompts/consistency_checker.txt
  dependency_mapper: ../../../../../orchestrator/example_prompts/dependency_mapper.txt
